# Adapt domain, certificate locations and PHP-FPM socket to the actual host.
# Install this application as a single instance with persistent private storage.
server {
    listen 80;
    access_log off;
    server_name clinic.example.org;
    return 301 https://clinic.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name clinic.example.org;
    root /srv/medicore/current/web/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/clinic.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # PHP must use upload_max_filesize=10M, post_max_size=12M.
    client_max_body_size 12m;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Query strings may contain patient search terms. Do not record access URLs.
    # Collect availability/latency metrics upstream without identifiers.
    access_log off;
    error_log /var/log/nginx/medicore-error.log crit;

    # This vhost must never answer arbitrary Host headers, including reset links.
    if ($host != clinic.example.org) { return 444; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }
    # Only the front controller is executable; private files have no public alias.
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
