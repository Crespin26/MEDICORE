; Apply to both the production CLI and FPM configuration, then reload PHP-FPM.
expose_php = Off
display_errors = Off
log_errors = On
zend.exception_ignore_args = On
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
opcache.enable = 1
; Keep timestamp validation for a predictable manual release/rollback process.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
